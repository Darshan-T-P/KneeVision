[project]
name = "kneevision"
version = "0.1.0"
description = "Knee OA severity grading using X-ray deep learning"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy",
    "pillow",
    "tqdm",
    "matplotlib",
    "scikit-learn",
    "jupyter",
    "ipykernel",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = [
    "dvc>=3.0",
    "dvc-s3",
    "pytest>=7.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
